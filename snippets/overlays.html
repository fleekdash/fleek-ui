<!-- Fleek UI snippets: Alpine overlay patterns (Pines-style x-data).
     Surfaces use popover/card tokens so they track theme + dark mode.
     x-cloak hides them until Alpine boots; x-transition for entrances. -->

<!-- Dropdown menu -->
<div class="relative" x-data="{ open: false }">
  <button
    type="button"
    class="fui-btn fui-btn-outline"
    x-on:click="open = !open"
    x-bind:aria-expanded="open"
    aria-haspopup="true">
    Actions
  </button>
  <div
    class="border-border bg-popover text-popover-foreground absolute right-0 z-50 mt-1 w-44 rounded-md border p-1 shadow-md"
    role="menu"
    x-show="open"
    x-cloak
    x-transition.opacity.scale.90
    x-on:click.outside="open = false"
    x-on:keydown.escape.window="open = false">
    <button
      type="button"
      class="hover:bg-muted flex w-full items-center rounded-sm px-2 py-1.5 text-sm"
      role="menuitem"
      x-on:click="open = false">
      Rename
    </button>
    <button
      type="button"
      class="hover:bg-muted flex w-full items-center rounded-sm px-2 py-1.5 text-sm"
      role="menuitem"
      x-on:click="open = false">
      Duplicate
    </button>
    <div class="border-border my-1 border-t" role="separator"></div>
    <button
      type="button"
      class="text-destructive hover:bg-destructive/10 flex w-full items-center rounded-sm px-2 py-1.5 text-sm"
      role="menuitem"
      x-on:click="open = false">
      Delete
    </button>
  </div>
</div>

<!-- Modal: canonical scrim classes copied verbatim from PortalOverlay
     (molecules/PortalOverlay) so Alpine modals and React overlays share one
     scrim. Body scroll is the host's concern inside an iframe - keep the
     surface itself scrollable. -->
<div x-data="{ open: false }">
  <button
    type="button"
    class="fui-btn fui-btn-primary"
    x-on:click="open = true">
    Open dialog
  </button>
  <template x-teleport="body">
    <div
      class="bg-background/50 fixed inset-0 z-50 flex items-center justify-center p-4 backdrop-blur-[2px]"
      role="dialog"
      aria-modal="true"
      x-show="open"
      x-cloak
      x-transition.opacity
      x-on:keydown.escape.window="open = false">
      <div
        class="fui-card w-full max-w-md"
        x-transition.opacity.scale.95
        x-on:click.outside="open = false">
        <div class="fui-card-header flex items-center justify-between">
          <span>Confirm</span>
          <button
            type="button"
            class="fui-btn fui-btn-ghost h-7 w-7 p-0"
            aria-label="Close"
            x-on:click="open = false">
            &times;
          </button>
        </div>
        <div class="fui-card-body text-muted-foreground text-sm">
          This action cannot be undone.
        </div>
        <div class="fui-card-footer flex items-center justify-end gap-2">
          <button
            type="button"
            class="fui-btn fui-btn-outline"
            x-on:click="open = false">
            Cancel
          </button>
          <button
            type="button"
            class="fui-btn fui-btn-destructive"
            x-on:click="open = false">
            Delete
          </button>
        </div>
      </div>
    </div>
  </template>
</div>

<!-- Tabs -->
<div x-data="{ tab: 'general' }">
  <div class="border-border flex gap-1 border-b" role="tablist">
    <button
      type="button"
      class="rounded-t-md px-3 py-1.5 text-sm font-medium"
      role="tab"
      x-bind:class="tab === 'general' ? 'bg-card text-foreground border border-border border-b-0 -mb-px' : 'text-muted-foreground hover:text-foreground'"
      x-bind:aria-selected="tab === 'general'"
      x-on:click="tab = 'general'">
      General
    </button>
    <button
      type="button"
      class="rounded-t-md px-3 py-1.5 text-sm font-medium"
      role="tab"
      x-bind:class="tab === 'advanced' ? 'bg-card text-foreground border border-border border-b-0 -mb-px' : 'text-muted-foreground hover:text-foreground'"
      x-bind:aria-selected="tab === 'advanced'"
      x-on:click="tab = 'advanced'">
      Advanced
    </button>
  </div>
  <div class="fui-card rounded-t-none p-4" role="tabpanel">
    <p class="text-sm" x-show="tab === 'general'">General settings.</p>
    <p class="text-sm" x-show="tab === 'advanced'" x-cloak>
      Advanced settings.
    </p>
  </div>
</div>

<!-- Tooltip (hover, no focus trap needed) -->
<span class="relative inline-block" x-data="{ show: false }">
  <button
    type="button"
    class="fui-btn fui-btn-ghost fui-btn-sm"
    x-on:mouseenter="show = true"
    x-on:mouseleave="show = false"
    x-on:focus="show = true"
    x-on:blur="show = false">
    ?
  </button>
  <span
    class="bg-foreground text-background absolute bottom-full left-1/2 z-50 mb-1 -translate-x-1/2 rounded-sm px-2 py-1 text-xs whitespace-nowrap"
    role="tooltip"
    x-show="show"
    x-cloak
    x-transition.opacity
    >Helpful hint</span
  >
</span>
