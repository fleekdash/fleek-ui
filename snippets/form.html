<!-- Fleek UI snippet: form fields.
     fui-input IS the design-system input for the markup tier (raw-input:ok
     — the React <Input> contract does not exist outside JSX): it carries
     border + focus ring (field-focus-ring tokens); aria-invalid flips it
     to the destructive ring. Labels use token typography only. -->

<div class="flex flex-col gap-1.5">
  <label class="text-foreground text-sm font-medium" for="title">Title</label>
  <input
    id="title"
    name="title"
    type="text"
    class="fui-input"
    placeholder="Hello world"
    required />
  <p class="text-muted-foreground text-xs">Shown on the item card.</p>
</div>

<div class="flex flex-col gap-1.5">
  <label class="text-foreground text-sm font-medium" for="notes">Notes</label>
  <textarea
    id="notes"
    name="notes"
    class="fui-input h-auto resize-y py-2"
    rows="3"></textarea>
</div>

<!-- Invalid state: server or Alpine sets aria-invalid="true" -->
<div class="flex flex-col gap-1.5">
  <label class="text-destructive text-sm font-medium" for="email">Email</label>
  <input
    id="email"
    name="email"
    type="email"
    class="fui-input"
    aria-invalid="true" />
  <p class="text-destructive text-xs" role="alert">Enter a valid email.</p>
</div>

<!-- Field grid -->
<div class="grid grid-cols-2 gap-3">
  <div class="flex flex-col gap-1.5">
    <label class="text-sm font-medium" for="from">From</label>
    <input id="from" type="date" class="fui-input" />
  </div>
  <div class="flex flex-col gap-1.5">
    <label class="text-sm font-medium" for="to">To</label>
    <input id="to" type="date" class="fui-input" />
  </div>
</div>
